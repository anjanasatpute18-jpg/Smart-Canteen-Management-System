<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Status - Smart Canteen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <style>
    .order-layout { display:grid; grid-template-columns:1fr 360px; gap:24px; align-items:start; }
    .tracker { display:flex; flex-direction:column; gap:0; position:relative; }
    .track-step { display:flex; gap:16px; padding:16px 0; position:relative; }
    .track-step:not(:last-child)::before {
      content:''; position:absolute; left:19px; top:48px; bottom:-16px; width:2px;
      background: var(--ink-200);
    }
    .track-step.done:not(:last-child)::before { background: var(--success); }
    .track-dot {
      width:40px; height:40px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center; font-size:1.1rem;
      background:var(--accent); border:2px solid var(--ink-200); z-index:1;
    }
    .track-step.done .track-dot { background:var(--success); color:#fff; border-color:var(--success); }
    .track-step.active .track-dot { background:var(--primary); color:#fff; border-color:var(--primary); animation:pulse 2s infinite; }
    .live-pill { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px; background:rgba(46,204,113,0.12); color:#1e8f4d; font-weight:700; font-size:13px; margin-top:8px; }
    .live-pill i { animation:pulse 1.2s infinite; }
    @media (max-width:900px){ .order-layout{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <script src="../js/app.js"></script>
  <script src="../js/data.js"></script>
  <script>
    initDashboard('orders');
    const content = document.getElementById('pageContent');
    const selectedId = getQueryParam('id');
    const order = Orders.getById(selectedId) || Orders.all()[0] || {
      id: 'ORD-2026-0427',
      createdAt: 'Jun 26, 2026, 12:30 PM',
      status: 'preparing',
      payment: 'Wallet',
      pickupCounter: 'Counter 3',
      items: [{ name: 'Veg Thali', qty: 1, price: 90 }, { name: 'Tea', qty: 2, price: 12 }],
      amount: 114
    };
    content.innerHTML = `
      <div class="page-header">
        <h1 class="page-title">Order Status <i class="fa-solid fa-box"></i></h1>
        <p class="page-subtitle">The Order Status page allows users to track their food orders in real time, including payment details and delivery progress. Users can view live status updates such as pending, preparing, ready, and delivered.</p>
      </div>
      <div class="order-layout">
        <div>
          <div class="list-card" style="padding:24px;margin-bottom:24px;">
            <div class="flex-between" style="margin-bottom:16px;">
              <div>
                <h3 style="font-size:1.2rem;">Order ${order.id}</h3>
                <p class="text-muted text-sm">Placed at ${order.createdAt}</p>
              </div>
              <span id="orderStatusBadge" class="badge badge-${order.status === 'cancelled' ? 'error' : order.status === 'completed' ? 'success' : 'warning'}">${order.status.charAt(0).toUpperCase() + order.status.slice(1)}</span>
            </div>
            <div class="live-pill"><i class="fa-solid fa-circle"></i><span id="liveStatusText">Live updates active</span></div>
            <div class="tracker" style="margin-top:12px;">
              <div class="track-step done"><div class="track-dot"><i class="fa-solid fa-check"></i></div><div><strong>Order Placed</strong><div class="text-muted text-sm">12:30 PM</div></div></div>
              <div class="track-step done"><div class="track-dot"><i class="fa-solid fa-check"></i></div><div><strong>Confirmed</strong><div class="text-muted text-sm">12:32 PM</div></div></div>
              <div class="track-step active"><div class="track-dot"><i class="fa-solid fa-fire-burner"></i></div><div><strong>Preparing</strong><div class="text-muted text-sm" id="prepStatus">In progress...</div></div></div>
              <div class="track-step"><div class="track-dot"><i class="fa-solid fa-rocket"></i></div><div><strong>Ready for Pickup</strong><div class="text-muted text-sm">Pending</div></div></div>
              <div class="track-step"><div class="track-dot"><i class="fa-solid fa-circle-check"></i></div><div><strong>Completed</strong><div class="text-muted text-sm">Pending</div></div></div>
            </div>
          </div>

          <div class="list-card" style="padding:24px;">
            <h3 style="margin-bottom:16px;">Order Summary</h3>
            ${order.items.map(item => `
              <div class="cart-row" style="border:none;padding:8px 0;">
                <div class="cart-info"><div class="cart-name">${item.name}</div><div class="cart-price">${formatINR(item.price)} × ${item.qty}</div></div>
                <div style="font-weight:700;">${formatINR(item.price * item.qty)}</div>
              </div>
            `).join('')}
          </div>
        </div>

        <div>
          <div class="summary-box" style="position:sticky;top:90px;">
            <h3 style="margin-bottom:16px;">Delivery Details</h3>
            <div class="summary-row"><span>Estimated Time</span><span style="color:var(--primary);font-weight:600;">15 mins</span></div>
            <div class="summary-row"><span>Pickup Counter</span><span>${order.pickupCounter}</span></div>
            <div class="summary-row"><span>Payment</span><span>${order.payment}</span></div>
            <div class="summary-row total"><span>Total</span><span>${formatINR(order.amount)}</span></div>
            <button class="btn btn-outline btn-block" style="margin-top:16px;border-color:var(--error);color:var(--error);" id="cancelBtn">${order.status === 'cancelled' ? 'Order Cancelled' : order.status === 'completed' ? 'Order Completed' : 'Cancel Order'}</button>
          </div>
        </div>
      </div>
    `;

    const liveStatusText = document.getElementById('liveStatusText');
    const prepStatus = document.getElementById('prepStatus');
    const trackerSteps = Array.from(document.querySelectorAll('.track-step'));
    let progressTick = 0;
    const liveTimer = setInterval(() => {
      progressTick += 1;
      const minuteText = progressTick % 2 === 0 ? '2 mins ago' : 'just now';
      liveStatusText.textContent = `Live updates active • ${minuteText}`;

      trackerSteps.forEach((step, index) => {
        step.classList.remove('active', 'done');
        if (index < Math.min(progressTick, 5)) {
          step.classList.add('done');
        }
      });

      if (progressTick <= 3) {
        trackerSteps[2].classList.add('active');
        prepStatus.textContent = progressTick === 3 ? 'Chef is finishing your order' : 'In progress...';
      } else if (progressTick === 3) {
        trackerSteps[2].classList.add('done');
        trackerSteps[3].classList.add('active');
        prepStatus.textContent = 'Food is ready for pickup';
        orderStatusBadge.textContent = 'Ready';
        orderStatusBadge.className = 'badge badge-success';
      } else if (progressTick >= 4) {
        trackerSteps[3].classList.add('done');
        trackerSteps[4].classList.add('active');
        prepStatus.textContent = 'Order completed';
        orderStatusBadge.textContent = 'Completed';
        orderStatusBadge.className = 'badge badge-success';
        liveStatusText.textContent = 'Order completed • Thank you!';
        clearInterval(liveTimer);
      }
    }, 1800);

    const orderStatusBadge = document.getElementById('orderStatusBadge');
    const cancelBtn = document.getElementById('cancelBtn');
    cancelBtn.disabled = order.status !== 'preparing';
    cancelBtn.style.opacity = order.status !== 'preparing' ? '0.7' : '1';
    cancelBtn.onclick = () => {
      if (order.status !== 'preparing') return;
      Modal.open(`
        <div style="text-align:center;padding:20px;">
          <div style="font-size:2rem;color:var(--error);margin-bottom:16px;"><i class="fa-solid fa-exclamation-circle"></i></div>
          <h3>Cancel Order?</h3>
          <p style="color:var(--ink-600);margin:8px 0 24px;">Are you sure you want to cancel order <strong>${order.id}</strong>? This action cannot be undone.</p>
          <div style="display:flex;gap:12px;justify-content:center;">
            <button class="btn btn-outline btn-sm" onclick="document.querySelector('.modal-overlay').remove();">Keep Order</button>
            <button class="btn btn-error btn-sm" onclick="cancelSelectedOrder('${order.id}');">Yes, Cancel it</button>
          </div>
        </div>
      `);
    };

    window.cancelSelectedOrder = (id) => {
      Orders.cancel(id);
      document.querySelector('.modal-overlay')?.remove();
      Toast.show(`✓ Order ${id} cancelled!`, 'success', 1800);
      
      setTimeout(() => location.reload(), 1000);
    };
  </script>
</body>
</html>
