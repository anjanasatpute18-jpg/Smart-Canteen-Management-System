<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart - Smart Canteen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <style>
    .cart-layout { display:grid; grid-template-columns:1fr 360px; gap:24px; align-items:start; }
    @media (max-width:900px){ .cart-layout{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <script src="../js/app.js"></script>
  <script src="../js/data.js"></script>
  <script>
    initDashboard('menu');
    const content = document.getElementById('pageContent');
    content.innerHTML = `
      <div class="page-header">
        <h1 class="page-title">Your Cart <i class="fa-solid fa-cart-shopping"></i></h1>
        <p class="page-subtitle">Review your items before checkout</p>
      </div>
      <div class="cart-layout">
        <div id="cartItems"></div>
        <div id="cartSummary"></div>
      </div>
    `;

    function renderCart() {
      const itemsEl = document.getElementById('cartItems');
      const summaryEl = document.getElementById('cartSummary');

      if (Cart.items.length === 0) {
        itemsEl.innerHTML = `
          <div class="empty-state glass" style="padding:48px;">
            <span class="emoji"><i class="fa-solid fa-cart-shopping"></i></span>
            <h3>Your cart is empty</h3>
            <p style="margin:8px 0 20px;">Add some delicious food to get started!</p>
            <button class="btn btn-primary" onclick="location.href='menu.html'">Browse Menu</button>
          </div>`;
        summaryEl.innerHTML = '';
        return;
      }

      itemsEl.innerHTML = '<div class="list-card">' + Cart.items.map(item => `
        <div class="cart-row">
          <img class="cart-thumb" src="${item.img}" alt="${item.name}" />
          <div class="cart-info">
            <div class="cart-name">${item.name}</div>
            <div class="cart-price">${formatINR(item.price)} each</div>
          </div>
          <div class="qty-control">
            <button class="qty-btn" onclick="changeQty(${item.id}, ${item.qty - 1})">−</button>
            <span class="qty-value">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${item.id}, ${item.qty + 1})">+</button>
          </div>
          <div style="font-weight:700;min-width:70px;text-align:right;">${formatINR(item.price * item.qty)}</div>
          <button class="icon-btn" style="width:36px;height:36px;" onclick="removeItem(${item.id})" title="Remove"><i class="fa-solid fa-trash"></i></button>
        </div>
      `).join('') + '</div>';

      const subtotal = Cart.total();
      const tax = Math.round(subtotal * 0.05);
      const total = subtotal + tax;

      summaryEl.innerHTML = `
        <div class="summary-box" style="position:sticky;top:90px;">
          <h3 style="margin-bottom:16px;">Order Summary</h3>
          <div class="summary-row"><span>Subtotal</span><span>${formatINR(subtotal)}</span></div>
          <div class="summary-row"><span>Taxes (5%)</span><span>${formatINR(tax)}</span></div>
          <div class="summary-row"><span>Delivery</span><span style="color:var(--success);">Free</span></div>
          <div class="summary-row total"><span>Total</span><span>${formatINR(total)}</span></div>
          <button class="btn btn-primary btn-block btn-lg" style="margin-top:16px;" onclick="checkout()">Checkout</button>
          <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="location.href='menu.html'">Continue Shopping</button>
        </div>
      `;
    }

    window.changeQty = (id, qty) => { Cart.updateQty(id, qty); renderCart(); };
    window.removeItem = (id) => { Cart.remove(id); renderCart(); };
    window.checkout = () => {
      const subtotal = Cart.total();
      const tax = Math.round(subtotal * 0.05);
      const total = subtotal + tax;
      if (!Cart.items.length) {
        Toast.show('Add items to your cart first.', 'info');
        return;
      }
      Store.set('tempBill', {
        items: Cart.items.map(i => ({ id: i.id, name: i.name, price: i.price, qty: i.qty })),
        total
      });
      Toast.show('Redirecting to payment...', 'success');
      setTimeout(() => location.href = 'upi-payment.html', 800);
    };

    renderCart();
  </script>
</body>
</html>
