<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login - Smart Canteen</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>

<body>

  <div class="auth-page">

    <div class="auth-card">

      <!-- LOGO -->
      <div class="auth-logo">

        <div class="mark">
          <i class="fa-solid fa-utensils"></i>
        </div>

        <h1>Welcome Back</h1>

        <p>
          Login to your Smart Canteen account
        </p>

      </div>


      <!-- LOGIN FORM -->

      <form id="loginForm" novalidate>

        <!-- IDENTIFIER -->

        <div class="field">

          <label>
            Enrollment Number or Email
          </label>

          <div class="input-group">

            <span class="icon">
              <i class="fa-solid fa-graduation-cap"></i>
            </span>

            <input
              class="input"
              id="identifier"
              placeholder="EN2026001 or you@example.com"
            />

          </div>

          <div
            class="field-error"
            id="err-identifier"
          ></div>

        </div>


        <!-- PASSWORD -->

        <div class="field">

          <label>
            Password
          </label>

          <div class="input-group">

            <span class="icon">
              <i class="fa-solid fa-lock"></i>
            </span>

            <input
              class="input"
              id="password"
              type="password"
              placeholder="Enter your password"
            />

          </div>

          <div
            class="field-error"
            id="err-password"
          ></div>

        </div>


        <!-- LOGIN BUTTON -->

        <button
          type="submit"
          class="btn btn-primary btn-block btn-lg"
        >
          Login
        </button>

      </form>


      <!-- FORGOT PASSWORD -->

      <div class="auth-footer">

        <a
          href="#"
          id="forgotLink"
        >
          Forgot Password?
        </a>

      </div>


      <!-- REGISTER -->

      <div class="auth-footer">

        Don't have an account?

        <a href="register.html">
          Register here
        </a>

      </div>


      <!-- ADMIN + HOME -->

      <div
        class="auth-footer"
        style="margin-top:8px;"
      >

        <a href="admin-login.html">
          Admin Login →
        </a>

        &nbsp;|&nbsp;

        <a href="../index.html">
          ← Home
        </a>

      </div>

    </div>

  </div>


  <!-- APP JS -->

  <script src="../js/app.js"></script>


  <script>

    /* =========================================================
       REGISTRATION SUCCESS MESSAGE
       ========================================================= */

    try {

      const reg =
        Store.get(
          'scms_registration_success',
          null
        );

      if (
        reg &&
        reg.message
      ) {

        Toast.show(
          reg.message,
          'success'
        );

        Store.remove(
          'scms_registration_success'
        );

      }

    } catch (e) {

      console.log(
        "Registration message error:",
        e
      );

    }


    /* =========================================================
       LOGIN
       ========================================================= */

    const form =
      document.getElementById(
        'loginForm'
      );


    function setError(
      id,
      msg
    ) {

      const element =
        document.getElementById(
          'err-' + id
        );

      if (element) {

        element.textContent =
          msg || '';

      }

    }


    form.addEventListener(
      'submit',
      async function (e) {

        e.preventDefault();


        const identifier =
          document
            .getElementById(
              'identifier'
            )
            .value
            .trim();


        const password =
          document
            .getElementById(
              'password'
            )
            .value;


        setError(
          'identifier',
          ''
        );

        setError(
          'password',
          ''
        );


        /* VALIDATION */

        if (!identifier) {

          setError(
            'identifier',
            'Please enter enrollment or email'
          );

          return;

        }


        if (!password) {

          setError(
            'password',
            'Please enter your password'
          );

          return;

        }


        /* PREVENT ADMIN LOGIN */

        if (
          identifier.toLowerCase() ===
          'janvisatpute18@gmail.com'
        ) {

          Toast.show(
            '❌ Admin cannot login here. Use Admin Portal!',
            'error',
            2000
          );

          return;

        }


        try {

          console.log(
            "LOGIN REQUEST:",
            {
              identifier:
                identifier
            }
          );


          /* CALL FLASK LOGIN API */

          const response =
            await fetch(
              'http://127.0.0.1:5000/api/login',
              {

                method: 'POST',

                headers: {
                  'Content-Type':
                    'application/json'
                },

                body:
                  JSON.stringify({

                    identifier:
                      identifier,

                    password:
                      password

                  })

              }
            );


          const data =
            await response.json();


          console.log(
            "LOGIN RESPONSE:",
            data
          );


          if (!response.ok) {

            setError(
              'password',
              data.message ||
              'Login failed'
            );

            return;

          }


          /* USER DATA */

          const user =
            data.user || {};


          /* SAVE LOGIN */

          Auth.login({

            name:
              user.name ||
              'Student User',

            enrollment:
              user.enrollment ||
              (
                identifier.includes('@')
                  ? 'EN2026001'
                  : identifier
              ),

            email:
              user.email ||
              (
                identifier.includes('@')
                  ? identifier
                  : 'student@edu.in'
              ),

            role:
              'student',

            department:
              user.department ||
              'Computer Science',

            phone:
              user.phone ||
              '+91 98765 43210',

            gender:
              user.gender ||
              'male',

            password:
              password,

            profile_images:
              user.profile_images ||
              undefined

          });


          /* SUCCESS */

          Toast.show(
            'Login successful!',
            'success'
          );


          setTimeout(
            function () {

              location.href =
                'dashboard.html';

            },
            800
          );


        } catch (error) {

          console.error(
            'Login Error:',
            error
          );


          setError(
            'password',
            'Cannot connect to server.'
          );

        }

      }
    );


    /* =========================================================
       FORGOT PASSWORD
       ========================================================= */

    document
      .getElementById(
        'forgotLink'
      )
      .addEventListener(
        'click',
        function (e) {

          e.preventDefault();


          /* OPEN MODAL */

          const overlay =
            Modal.open(`

              <h3
                style="
                  margin-bottom:12px;
                "
              >
                Reset Password
              </h3>


              <!-- EMAIL -->

              <div class="field">

                <label>
                  Registered Email
                </label>

                <input
                  class="input"
                  id="resetEmail"
                  type="email"
                  placeholder="Your registered email"
                />

              </div>


              <!-- SEND OTP -->

              <button
                class="btn btn-primary btn-block"
                id="sendOtpBtn"
              >
                Send OTP
              </button>


              <!-- RESET FLOW -->

              <div
                id="resetFlow"
                style="
                  display:none;
                  margin-top:16px;
                "
              >


                <!-- OTP -->

                <div class="field">

                  <label>
                    Enter OTP
                  </label>

                  <input
                    class="input"
                    id="resetOtp"
                    placeholder="Enter 6 digit OTP"
                    maxlength="6"
                    inputmode="numeric"
                  />

                </div>


                <!-- NEW PASSWORD -->

                <div class="field">

                  <label>
                    New Password
                  </label>

                  <input
                    class="input"
                    id="resetPassword"
                    type="password"
                    placeholder="Enter new password"
                    maxlength="6"
                  />

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="field">

                  <label>
                    Confirm Password
                  </label>

                  <input
                    class="input"
                    id="resetConfirm"
                    type="password"
                    placeholder="Confirm password"
                    maxlength="6"
                  />

                </div>


                <!-- VALIDATION -->

                <div
                  id="resetValidation"
                  style="
                    color:var(--error);
                    font-size:0.9rem;
                    min-height:20px;
                    margin-bottom:12px;
                  "
                ></div>


                <!-- UPDATE -->

                <button
                  class="btn btn-primary btn-block"
                  id="verifyResetBtn"
                  disabled
                >
                  Update Password
                </button>

              </div>

            `);


          /* =====================================================
             ELEMENTS
             ===================================================== */

          const sendOtpBtn =
            document.getElementById(
              'sendOtpBtn'
            );


          const resetFlow =
            document.getElementById(
              'resetFlow'
            );


          const resetEmail =
            document.getElementById(
              'resetEmail'
            );


          const resetOtp =
            document.getElementById(
              'resetOtp'
            );


          const resetPassword =
            document.getElementById(
              'resetPassword'
            );


          const resetConfirm =
            document.getElementById(
              'resetConfirm'
            );


          const resetValidation =
            document.getElementById(
              'resetValidation'
            );


          const verifyResetBtn =
            document.getElementById(
              'verifyResetBtn'
            );


          /* =====================================================
             OTP EMAIL VARIABLE
             ===================================================== */

          let otpSentTo = null;


          /* =====================================================
             EMAIL VALIDATION
             ===================================================== */

          function validateEmail(
            email
          ) {

            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
              .test(email);

          }


          /* =====================================================
             RESET VALIDATION
             ===================================================== */

          function validateResetInputs() {

            resetValidation.textContent =
              '';


            const otp =
              resetOtp.value.trim();


            const pass =
              resetPassword.value;


            const confirm =
              resetConfirm.value;


            /* OTP */

            if (
              !/^\d{6}$/.test(otp)
            ) {

              resetValidation.textContent =
                'OTP must be exactly 6 digits.';

              verifyResetBtn.disabled =
                true;

              return false;

            }


            /* PASSWORD */

            if (
              pass.length !== 6
            ) {

              resetValidation.textContent =
                'Password must be exactly 6 characters.';

              verifyResetBtn.disabled =
                true;

              return false;

            }


            /* CONFIRM */

            if (
              confirm !== pass
            ) {

              resetValidation.textContent =
                'Passwords do not match.';

              verifyResetBtn.disabled =
                true;

              return false;

            }


            verifyResetBtn.disabled =
              false;


            return true;

          }


          /* =====================================================
             SEND OTP
             ===================================================== */

          sendOtpBtn.addEventListener(
            'click',
            async function () {

              const email =
                resetEmail.value
                  .trim();


              /* EMAIL CHECK */

              if (
                !validateEmail(
                  email
                )
              ) {

                Toast.show(
                  'Enter a valid email address',
                  'error'
                );

                return;

              }


              try {

                sendOtpBtn.disabled =
                  true;


                sendOtpBtn.textContent =
                  'Sending OTP...';


                /* FLASK API */

                const response =
                  await fetch(
                    'http://127.0.0.1:5000/api/forgot-password',
                    {

                      method: 'POST',

                      headers: {

                        'Content-Type':
                          'application/json'

                      },

                      body:
                        JSON.stringify({

                          email:
                            email

                        })

                    }
                  );


                const data =
                  await response.json();


                console.log(
                  "OTP RESPONSE:",
                  data
                );


                /* ERROR */

                if (!response.ok) {

                  Toast.show(
                    data.message ||
                    'Failed to send OTP',
                    'error'
                  );


                  sendOtpBtn.disabled =
                    false;


                  sendOtpBtn.textContent =
                    'Send OTP';


                  return;

                }


                /* SAVE EMAIL */

                otpSentTo =
                  email;


                /* SHOW OTP SECTION */

                resetFlow.style.display =
                  'block';


                sendOtpBtn.textContent =
                  'OTP Sent ✓';


                Toast.show(
                  'OTP sent successfully! Check your email.',
                  'success'
                );


              } catch (error) {

                console.error(
                  'OTP ERROR:',
                  error
                );


                Toast.show(
                  'Cannot connect to server.',
                  'error'
                );


                sendOtpBtn.disabled =
                  false;


                sendOtpBtn.textContent =
                  'Send OTP';

              }

            }
          );


          /* =====================================================
             INPUT VALIDATION
             ===================================================== */

          [
            resetOtp,
            resetPassword,
            resetConfirm

          ].forEach(
            function (input) {

              input.addEventListener(
                'input',
                validateResetInputs
              );

            }
          );


          /* =====================================================
             UPDATE PASSWORD
             ===================================================== */

          verifyResetBtn.addEventListener(
            'click',
            async function () {


              const email =
                otpSentTo ||
                resetEmail.value.trim();


              const otp =
                resetOtp.value.trim();


              const newPassword =
                resetPassword.value;


              const confirmPassword =
                resetConfirm.value;


              /* CHECK */

              if (
                !email ||
                !otp ||
                !newPassword ||
                !confirmPassword
              ) {

                resetValidation.textContent =
                  'Please fill all fields.';

                return;

              }


              /* VALIDATE */

              if (
                !validateResetInputs()
              ) {

                return;

              }


              try {

                verifyResetBtn.disabled =
                  true;


                verifyResetBtn.textContent =
                  'Updating...';


                /* =================================================
                   IMPORTANT:

                   SEND OTP TO FLASK

                   Flask /api/reset-password
                   will verify OTP.
                   ================================================= */


                const response =
                  await fetch(
                    'http://127.0.0.1:5000/api/reset-password',
                    {

                      method: 'POST',

                      headers: {

                        'Content-Type':
                          'application/json'

                      },

                      body:
                        JSON.stringify({

                          email:
                            email,

                          otp:
                            otp,

                          password:
                            newPassword

                        })

                    }
                  );


                const data =
                  await response.json();


                console.log(
                  "PASSWORD RESET RESPONSE:",
                  data
                );


                /* ERROR */

                if (!response.ok) {

                  resetValidation.textContent =
                    data.message ||
                    'Password reset failed.';


                  Toast.show(
                    data.message ||
                    'Password reset failed.',
                    'error'
                  );


                  verifyResetBtn.disabled =
                    false;


                  verifyResetBtn.textContent =
                    'Update Password';


                  return;

                }


                /* SUCCESS */

                Toast.show(
                  'Password updated successfully! Please login.',
                  'success'
                );


                /* CLOSE MODAL */

                overlay.remove();

              } catch (error) {

                console.error(
                  'PASSWORD RESET ERROR:',
                  error
                );


                resetValidation.textContent =
                  'Cannot connect to server.';


                verifyResetBtn.disabled =
                  false;


                verifyResetBtn.textContent =
                  'Update Password';

              }

            }
          );

        }
      );

  </script>

</body>

</html>
