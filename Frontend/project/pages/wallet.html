<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallet - Smart Canteen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <style>
    .wallet-hero {
      max-width:480px; margin:0 auto 32px; border-radius:24px; padding:32px;
      background:linear-gradient(135deg,var(--primary),var(--primary-dark));
      color:#fff; box-shadow:var(--shadow-orange); text-align:center;
    }
    .wallet-balance { font-size:3rem; font-weight:700; margin:8px 0; }
    .tx-row { display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--ink-200); }
    .tx-row:last-child { border-bottom:none; }
    .tx-icon { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.2rem; flex-shrink:0; }
  </style>
</head>
<body>
  <script src="../js/app.js"></script>
  <script>
    initDashboard('wallet');
    const content = document.getElementById('pageContent');

    const transactions = Wallet.getTransactions().length ? Wallet.getTransactions() : [
      { label: 'Wallet Recharge', note: 'via UPI', amount: 1000, type: 'credit', date: 'Today' },
      { label: 'Order Payment', note: 'ORD-2026-0427', amount: -114, type: 'debit', date: 'Today' }
    ];

    content.innerHTML = `
      <div class="page-header">
        <h1 class="page-title">My Wallet <i class="fa-solid fa-wallet"></i></h1>
        <p class="page-subtitle">Manage your balance and transactions</p>
      </div>

      <div class="wallet-hero">
        <div style="font-size:14px;opacity:0.9;">Available Balance</div>
        <div class="wallet-balance">${formatINR(Wallet.getBalance())}</div>
        <button class="btn" style="background:#fff;color:var(--primary);font-weight:600;" id="addMoneyBtn"><i class="fa-solid fa-plus"></i> Add Money</button>
      </div>

      <div class="list-card" style="padding:0 20px;max-width:600px;margin:0 auto;">
        <h3 style="padding:20px 0 8px;">Recent Transactions</h3>
        ${transactions.map(t => `
          <div class="tx-row">
            <div style="display:flex;gap:12px;align-items:center;">
              <div class="tx-icon" style="background:${t.type === 'credit' ? 'rgba(46,204,113,0.15)' : 'rgba(231,76,60,0.15)'};"><i class="fa-solid ${t.type === 'credit' ? 'fa-money-bill-wave' : 'fa-utensils'}"></i></div>
              <div><div style="font-weight:600;">${t.label}</div><div class="text-muted text-sm">${t.note} • ${t.date}</div></div>
            </div>
            <div style="font-weight:700;color:${t.amount > 0 ? 'var(--success)' : 'var(--ink-800)'};">
              ${t.amount > 0 ? '+' : ''}${formatINR(t.amount)}
            </div>
          </div>
        `).join('')}
      </div>
    `;

    document.getElementById('addMoneyBtn').onclick = () => {
      const overlay = Modal.open(`
        <h3 style="margin-bottom:16px;">Add Money to Wallet</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
          ${[100, 500, 1000, 2000].map(a => `<button class="btn btn-ghost" onclick="document.getElementById('addAmt').value='${a}'">${formatINR(a)}</button>`).join('')}
        </div>
        <div class="field"><label>Amount</label><input class="input" id="addAmt" type="number" placeholder="Enter amount" value="500" /></div>
        <button class="btn btn-primary btn-block" onclick="addMoneyToWallet(this.closest('.modal-overlay'))">Add Money</button>
      `);
    };

    window.addMoneyToWallet = (overlay) => {
      const amount = Number(document.getElementById('addAmt').value || 0);
      if (!amount || amount <= 0) {
        Toast.show('Please enter a valid amount', 'info');
        return;
      }
      Wallet.add(amount, { label: 'Wallet Recharge', note: 'Added via app' });
      Toast.show('Money added successfully!', 'success');
      overlay.remove();
      setTimeout(() => location.reload(), 700);
    };
  </script>
</body>
</html>
