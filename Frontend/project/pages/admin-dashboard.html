<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Smart Canteen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <style>
    .admin-sidebar .nav-item.active { background:linear-gradient(135deg,#2D2D2D,#1A1A1A); box-shadow:0 8px 20px rgba(0,0,0,0.2); }
    .admin-table { width:100%; border-collapse:collapse; }
    .admin-table th { text-align:left; padding:14px 16px; font-size:13px; color:var(--ink-500); text-transform:uppercase; letter-spacing:1px; border-bottom:2px solid var(--ink-200); }
    .admin-table td { padding:14px 16px; border-bottom:1px solid var(--ink-200); }
    .admin-table tr:hover td { background:var(--accent); }
    .row-thumb { width:40px; height:40px; border-radius:10px; object-fit:cover; }
    .action-btn { padding:6px 10px; border-radius:8px; font-size:13px; font-weight:600; }
    .analytics-range { display:flex; gap:8px; flex-wrap:wrap; }
    .range-btn { border:1px solid var(--ink-200); background:#fff; color:var(--ink-700); border-radius:999px; padding:7px 12px; font-size:13px; font-weight:600; cursor:pointer; }
    .range-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .analytics-summary { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:16px; margin-bottom:18px; }
    .stat-grid { grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); }
    .stat-card { min-height:126px; border:1px solid rgba(0,0,0,.05); box-shadow:0 10px 24px rgba(15,23,42,.06); }
    .analytics-card-mini { padding:16px; border-radius:16px; background:linear-gradient(135deg, var(--secondary), #fff); border:1px solid var(--ink-200); }
    .analytics-card-mini .label { font-size:12px; color:var(--ink-500); text-transform:uppercase; letter-spacing:1px; }
    .analytics-card-mini .value { font-size:1.4rem; font-weight:700; color:var(--ink-900); margin-top:6px; }
    .analytics-grid { display:grid; grid-template-columns:1.4fr 0.9fr; gap:20px; align-items:start; }
    .chart-wrap { min-height:300px; padding:10px 0; }
    .top-items-list { display:grid; gap:10px; }
    .top-item-row { display:grid; grid-template-columns:90px 1fr 38px; gap:10px; align-items:center; }
    .top-item-row .bar { height:8px; border-radius:999px; background:var(--ink-200); overflow:hidden; }
    .top-item-row .bar > span { display:block; height:100%; background:linear-gradient(90deg, var(--primary), var(--warning)); border-radius:999px; }
    .admin-profile-chip { display:flex; align-items:center; gap:10px; padding:6px 10px; border:1px solid var(--ink-200); border-radius:999px; background:#fff; box-shadow:0 6px 18px rgba(0,0,0,.06); cursor:pointer; transition:transform .2s ease, box-shadow .2s ease; }
    .admin-profile-chip:hover { transform:translateY(-1px); box-shadow:0 10px 24px rgba(0,0,0,.12); }
    .admin-profile-meta { display:flex; flex-direction:column; line-height:1.2; }
    .admin-profile-name { font-size:13px; font-weight:700; color:var(--ink-900); }
    .admin-profile-role { font-size:11px; color:var(--ink-500); }
    @media (max-width:900px){ .analytics-summary{grid-template-columns:1fr;} .analytics-grid{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <script src="../js/app.js"></script>
  <script src="../js/data.js"></script>
  <script>
    if (!Auth.guardAdmin()) throw new Error('admin only');
    const user = Auth.getUser();
    const avatarSrc = (typeof createGenderAvatar === 'function') ? createGenderAvatar(user?.gender) : 'https://images.pexels.com/photos/220453/pexels-photo-220453.jpeg?auto=compress&cs=tinysrgb&w=200';

    function handleAdminLogout() {
      Store.remove('scms_user');
      Store.remove('scms_admin_profile');
      Store.remove('scms_admin_notifications');
      Auth.recordLoginEvent({ type: 'logout', role: 'admin', email: user?.email || 'admin@edu.in', message: 'Admin signed out.' });
      window.location.href = 'admin-login.html';
    }

    document.body.innerHTML = `
      <div class="app">
        <aside class="sidebar admin-sidebar" id="sidebar">
          <div class="sidebar-header">
            <div class="sidebar-logo" style="background:linear-gradient(135deg,#2D2D2D,#1A1A1A);"><i class="fa-solid fa-shield-halved"></i></div>
            <div class="sidebar-title">Admin Panel<small>Smart Canteen</small></div>
          </div>
          <nav class="sidebar-nav">
            <div class="nav-section-label">Management</div>
            <a class="nav-item active" href="#" data-section="dashboard"><span class="nav-icon"><i class="fa-solid fa-chart-line"></i></span><span>Dashboard</span></a>
            <a class="nav-item" href="#" data-section="menu"><span class="nav-icon"><i class="fa-solid fa-utensils"></i></span><span>Manage Menu</span></a>
            <a class="nav-item" href="#" data-section="students"><span class="nav-icon"><i class="fa-solid fa-users"></i></span><span>Manage Students</span></a>
            <a class="nav-item" href="#" data-section="orders"><span class="nav-icon"><i class="fa-solid fa-box"></i></span><span>View Orders</span></a>
            <a class="nav-item" href="#" data-section="reports"><span class="nav-icon"><i class="fa-solid fa-money-bill-wave"></i></span><span>Payment Reports</span></a>
            <a class="nav-item" href="#" data-section="qr"><span class="nav-icon"><i class="fa-solid fa-qrcode"></i></span><span>QR Management</span></a>
          </nav>
          <div style="padding:16px;">
            <a class="nav-item" href="#" onclick="handleAdminLogout()" style="color:var(--error);"><span class="nav-icon"><i class="fa-solid fa-right-from-bracket"></i></span><span>Logout</span></a>
          </div>
        </aside>
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
        <div class="main">
          <header class="navbar">
            <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
            <div class="navbar-search"><span class="icon"><i class="fa-solid fa-magnifying-glass"></i></span><input class="input" id="adminSearchInput" placeholder="Search..." /></div>
            <div class="navbar-actions">
              <button class="icon-btn" title="Notifications" id="notificationBtn"><i class="fa-solid fa-bell"></i><span class="dot" id="adminNotificationCountDot"></span></button>
              <div class="admin-profile-chip" id="adminProfileBtn" title="Admin Profile" onclick="location.href='profile.html'">
                <img class="avatar" src="${avatarSrc}" alt="Admin" />
                <div class="admin-profile-meta">
                  <div class="admin-profile-name">${user?.name || 'Admin User'}</div>
                  <div class="admin-profile-role">Administrator</div>
                </div>
              </div>
            </div>
          </header>
          <main class="page" id="pageContent"></main>
        </div>
      </div>
    `;

    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebarBackdrop');
    document.getElementById('menuToggle').onclick = () => { sidebar.classList.add('open'); backdrop.classList.add('open'); };
    backdrop.onclick = () => { sidebar.classList.remove('open'); backdrop.classList.remove('open'); };

    Notifications.ensureSeed('admin');
    Notifications.renderBell('admin');
    Notifications.runSimulation('admin');

    document.getElementById('notificationBtn')?.addEventListener('click', () => {
      Notifications.openModal('admin');
    });

    const content = document.getElementById('pageContent');
    const orders = [
      { id: 'ORD101', student: 'Rahul', items: 'Tea, Poha', amount: 80, status: 'Ready' },
      { id: 'ORD102', student: 'Aarav', items: 'Veg Thali, Tea', amount: 114, status: 'Preparing' },
      { id: 'ORD103', student: 'Priya', items: 'Pav Bhaji', amount: 100, status: 'Completed' },
      { id: 'ORD104', student: 'Sneha', items: 'Coffee', amount: 140, status: 'Cancelled' }
    ];
    const payments = [
      { id: 'PAY101', student: 'Rahul', amount: 120, method: 'UPI', status: 'Paid', date: '06-07-2026' },
      { id: 'PAY102', student: 'Sneha', amount: 180, method: 'Cash', status: 'Paid', date: '06-07-2026' },
      { id: 'PAY103', student: 'Aarav', amount: 95, method: 'UPI', status: 'Pending', date: '06-07-2026' },
      { id: 'PAY104', student: 'Priya', amount: 220, method: 'Cash', status: 'Paid', date: '06-07-2026' }
    ];
    const qrRecords = [
      { id: 'QR-001', student: 'Rahul', type: 'Student QR', code: 'STU-RAHUL-101', status: 'Active', generatedAt: '06-07-2026 09:10' },
      { id: 'QR-002', student: 'Sneha', type: 'Payment QR', code: 'PAY-UPI-120', status: 'Used', generatedAt: '06-07-2026 10:20' },
      { id: 'QR-003', student: 'Aarav', type: 'Student QR', code: 'STU-AARAV-102', status: 'Active', generatedAt: '06-07-2026 11:40' }
    ];
    const qrScanHistory = [
      { id: 'SCAN-001', student: 'Rahul', item: 'Veg Thali', time: '09:12', location: 'Counter 1' },
      { id: 'SCAN-002', student: 'Sneha', item: 'Coffee', time: '10:25', location: 'Counter 2' },
      { id: 'SCAN-003', student: 'Aarav', item: 'Pav Bhaji', time: '11:42', location: 'Counter 3' }
    ];

    let analyticsChart = null;
    let analyticsRange = 'daily';
    let analyticsHistoryDate = (() => {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    })();
    let activeSection = 'dashboard';
    let searchTerm = '';

    function escapeHtml(value = '') {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

   async function getAnalyticsOrders() {
  try {
    const response = await fetch('http://127.0.0.1:5000/api/admin/orders');

    if (!response.ok) {
      throw new Error('Failed to load analytics orders');
    }

    const backendOrders = await response.json();

    return backendOrders.map(order => ({
      id: order.order_id,
      createdAt: order.order_time,
      amount: Number(order.total_amount || 0),
      items: [{
        name: order.food_name,
        qty: Number(order.quantity || 0),
        price: Number(order.price || 0)
      }]
    }));

  } catch (error) {
    console.error('Analytics Orders Error:', error);
    return [];
  }
}
    

    function parseOrderDate(value) {
      if (!value) return new Date();
      const parsed = new Date(value);
      return Number.isNaN(parsed.getTime()) ? new Date() : parsed;
    }

    function getAnalyticsData(range = analyticsRange, historyDate = analyticsHistoryDate) {
      const ordersList =  getAnalyticsOrders();
      const now = new Date();
      const labels = [];
      const sales = [];
      const income = [];
      let bucketOrders = [];
      let periodLabel = 'Today';

      const getBucketOrdersForDate = (targetDate) => {
        const start = new Date(targetDate);
        start.setHours(0, 0, 0, 0);
        const end = new Date(targetDate);
        end.setHours(23, 59, 59, 999);
        return ordersList.filter(order => {
          const created = parseOrderDate(order.createdAt);
          return created >= start && created <= end;
        });
      };

      if (range === 'history') {
        const selectedDate = new Date(`${historyDate || analyticsHistoryDate}T00:00:00`);
        bucketOrders = getBucketOrdersForDate(selectedDate);
        periodLabel = selectedDate.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        labels.push(selectedDate.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }));
        sales.push(bucketOrders.reduce((sum, order) => sum + (order.items || []).reduce((s, item) => s + Number(item.qty || 0), 0), 0));
        income.push(bucketOrders.reduce((sum, order) => sum + Number(order.amount || 0), 0));
      } else {
        const today = new Date(now);
        today.setHours(0, 0, 0, 0);
        bucketOrders = getBucketOrdersForDate(today);
        periodLabel = 'Today';
        labels.push(today.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }));
        sales.push(bucketOrders.reduce((sum, order) => sum + (order.items || []).reduce((s, item) => s + Number(item.qty || 0), 0), 0));
        income.push(bucketOrders.reduce((sum, order) => sum + Number(order.amount || 0), 0));
      }

      const topItems = {};
      bucketOrders.forEach(order => {
        (order.items || []).forEach(item => {
          const key = item.name || 'Item';
          topItems[key] = (topItems[key] || 0) + Number(item.qty || 0);
        });
      });

      const sortedItems = Object.entries(topItems).sort((a, b) => b[1] - a[1]).slice(0, 5);
      const totalItemsSold = sales.reduce((sum, value) => sum + value, 0);
      const totalIncome = income.reduce((sum, value) => sum + value, 0);

      return { labels, sales, income, topItems: sortedItems, totalItemsSold, totalIncome, records: bucketOrders, periodLabel };
    }

    function renderAnalyticsPanel(containerId) {
      const container = document.getElementById(containerId);
      if (!container) return;
      const data = getAnalyticsData();
      container.innerHTML = `
        <div class="analytics-range" style="margin-bottom:12px;">
          <button class="range-btn ${analyticsRange === 'daily' ? 'active' : ''}" data-range="daily">Daily</button>
          <button class="range-btn ${analyticsRange === 'history' ? 'active' : ''}" data-range="history">History</button>
        </div>
        ${analyticsRange === 'history' ? `
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
            <label style="font-size:13px;color:var(--ink-600);">Select date
              <input id="historyDateInput" type="date" value="${analyticsHistoryDate}" style="margin-left:8px;padding:8px 10px;border:1px solid var(--ink-200);border-radius:10px;" />
            </label>
            <button class="btn btn-primary btn-sm" id="loadHistoryBtn"><i class="fa-solid fa-clock-rotate-left"></i> View Sales</button>
          </div>
        ` : ''}
        <div class="text-muted" style="margin-bottom:12px;">${analyticsRange === 'history' ? `Showing sales for ${data.periodLabel}` : 'Showing sales for today'}</div>
        <div class="analytics-summary">
          <div class="analytics-card-mini">
            <div class="label">Items Sold</div>
            <div class="value">${data.totalItemsSold}</div>
          </div>
          <div class="analytics-card-mini">
            <div class="label">Income</div>
            <div class="value">${formatINR(data.totalIncome)}</div>
          </div>
          <div class="analytics-card-mini">
            <div class="label">Top Item</div>
            <div class="value">${data.topItems[0] ? data.topItems[0][0] : 'No sales yet'}</div>
          </div>
        </div>
        <div class="analytics-grid">
          <div class="chart-wrap"><canvas id="salesChart"></canvas></div>
          <div class="list-card" style="padding:16px;">
            <h4 style="margin-bottom:12px;">${analyticsRange === 'history' ? 'Sales Records' : 'Today\'s Sales Records'}</h4>
            <div class="top-items-list">
              ${data.records.length ? data.records.map(record => `
                <div style="display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ink-200);">
                  <div>
                    <div style="font-weight:600;">${escapeHtml(record.id || 'Order')}</div>
                    <div class="text-muted" style="font-size:12px;">${escapeHtml(record.createdAt || 'No date')}</div>
                  </div>
                  <div style="text-align:right;">
                    <div style="font-weight:700;color:var(--primary);">${formatINR(record.amount || 0)}</div>
                    <div class="text-muted" style="font-size:12px;">${escapeHtml((record.items || []).map(item => `${item.name} × ${item.qty}`).join(', ') || 'No items')}</div>
                  </div>
                </div>
              `).join('') : '<div class="text-muted">No sales were recorded for this date.</div>'}
            </div>
          </div>
        </div>
      `;

      if (analyticsChart) analyticsChart.destroy();
      const chartCanvas = document.getElementById('salesChart');
      if (chartCanvas) {
        analyticsChart = new Chart(chartCanvas, {
          type: 'bar',
          data: {
            labels: data.labels,
            datasets: [
              {
                label: 'Items Sold',
                data: data.sales,
                backgroundColor: 'rgba(255,122,0,0.75)',
                borderRadius: 8,
                maxBarThickness: 26
              },
              {
                label: 'Income',
                data: data.income,
                type: 'line',
                borderColor: '#2ecc71',
                backgroundColor: 'rgba(46,204,113,0.15)',
                tension: 0.35,
                yAxisID: 'y1',
                pointRadius: 4
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            scales: {
              y: { beginAtZero: true, ticks: { callback: value => `${value}` } },
              y1: { beginAtZero: true, position: 'right', grid: { drawOnChartArea: false }, ticks: { callback: value => `${formatINR(value)}` } }
            },
            plugins: { legend: { position: 'bottom' } }
          }
        });
      }

      document.querySelectorAll('.range-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          analyticsRange = btn.getAttribute('data-range');
          document.querySelectorAll('.range-btn').forEach(b => b.classList.toggle('active', b === btn));
          renderAnalyticsPanel(containerId);
        });
      });

      const historyDateInput = document.getElementById('historyDateInput');
      const loadHistoryBtn = document.getElementById('loadHistoryBtn');

      if (historyDateInput) {
        historyDateInput.addEventListener('change', event => {
          analyticsHistoryDate = event.target.value || analyticsHistoryDate;
        });
      }

      if (loadHistoryBtn) {
        loadHistoryBtn.addEventListener('click', () => {
          analyticsRange = 'history';
          document.querySelectorAll('.range-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-range') === 'history'));
          renderAnalyticsPanel(containerId);
        });
      }
    }

    function bindSearchInput() {
      const input = document.getElementById('adminSearchInput');
      if (!input) return;
      input.value = searchTerm;
      input.oninput = (event) => {
        searchTerm = (event.target.value || '').trim().toLowerCase();
        setActiveSection(activeSection);
      };
    }

    function getDashboardStats() {
      const menuItems = Menu.getAll();
      Orders.syncFromStorage();
      const ordersList = Orders.all();
      const totalOrders = ordersList.length;
    
      const revenue = ordersList
        .filter(order => {
          const status = String(order.status || '').toLowerCase();
          const paymentStatus = String(order.paymentStatus || '').toLowerCase();
          return status !== 'cancelled' && paymentStatus !== 'pending' && paymentStatus !== 'unpaid' && paymentStatus !== 'failed';
        })
        .reduce((sum, order) => sum + Number(order.amount || 0), 0);

      return {
        menuCount: menuItems.length,
        totalOrders,
        revenue
      };
    }

    function refreshDashboardIfVisible() {
      if (activeSection !== 'dashboard') return;
      renderDashboardSection();
    }

    function renderDashboardSection() {
      const stats = getDashboardStats();
      loadAdminDashboardStats();
      content.innerHTML = `
        <div class="page-header">
          <h1 class="page-title">Admin Dashboard <i class="fa-solid fa-chart-line"></i></h1>
          <p class="page-subtitle">Welcome back, ${user.name}</p>
        </div>

        <div class="stat-grid stagger">
          <div class="stat-card"><div class="stat-icon orange"><i class="fa-solid fa-users"></i></div><div><div class="stat-value">${stats.menuCount}</div><div class="stat-label">Total Menu Items</div></div></div>
          <div class="stat-card"><div class="stat-icon blue"><i class="fa-solid fa-box"></i></div><div><div class="stat-value">${stats.totalOrders}</div><div class="stat-label">Total Orders</div></div></div>
          <div class="stat-card"><div class="stat-icon green"><i class="fa-solid fa-money-bill-wave"></i></div><div><div class="stat-value">${formatINR(stats.revenue)}</div><div class="stat-label">Revenue</div></div></div>
          <div class="stat-card"><div class="stat-icon red"><i class="fa-solid fa-hourglass-half"></i></div><div><div class="stat-value">${stats.pendingOrders}</div><div class="stat-label">Pending Orders</div></div></div>
        </div>

        <div class="list-card" style="padding:24px;margin-top:24px;">
          <div class="flex-between" style="margin-bottom:16px;">
            <h3>Sales Analytics</h3>
            <div class="analytics-range">
              <button class="range-btn active" data-range="daily">Daily</button>
              <button class="range-btn" data-range="history">History</button>
            </div>
          </div>
          <div id="analyticsPanel"></div>
        </div>

        <div style="display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-top:24px;" class="admin-grid">
          <div class="list-card" style="padding:24px;">
            <div class="flex-between" style="margin-bottom:16px;">
              <h3>Current Menu</h3>
              <button class="btn btn-primary btn-sm" onclick="setActiveSection('menu')"><i class="fa-solid fa-utensils"></i> Manage Menu</button>
            </div>
            <div id="quickMenuList"></div>
          </div>
          <div class="list-card" style="padding:24px;">
            <h3 style="margin-bottom:16px;">Recent Orders</h3>
            <div id="recentOrders"></div>
          </div>
        </div>
      `;

      document.getElementById('quickMenuList').innerHTML = Menu.getAll().slice(0, 6).map(item => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ink-200);">
          <div style="font-weight:600;">${escapeHtml(item.name)}</div>
          <div style="font-weight:700;color:var(--primary);">${formatINR(item.price)}</div>
        </div>
      `).join('');

      const recentOrdersList = Orders.all().slice(0, 5);
      document.getElementById('recentOrders').innerHTML = recentOrdersList.length ? recentOrdersList.map(order => {
        const status = String(order.status || 'Pending').toLowerCase();
        const badgeClass = status === 'completed' ? 'success' : status === 'cancelled' ? 'error' : 'warning';
        return `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--ink-200);">
            <div>
              <div style="font-weight:600;font-size:14px;">${escapeHtml(order.id || 'ORD')}</div>
              <div class="text-muted" style="font-size:12px;">${escapeHtml(order.userEnrollment || order.userEmail || 'Student')}</div>
            </div>
            <div style="text-align:right;">
              <div style="font-weight:700;color:var(--primary);">${formatINR(order.amount || 0)}</div>
              <span class="badge badge-${badgeClass}">${escapeHtml(order.status || 'Pending')}</span>
            </div>
          </div>
        `;
      }).join('') : '<div class="text-muted">No orders have been placed yet.</div>';

      renderAnalyticsPanel('analyticsPanel');
      bindSearchInput();
    }

    function renderMenuSection() {
      content.innerHTML = `
        <div class="page-header">
          <h1 class="page-title">Manage Menu <i class="fa-solid fa-utensils"></i></h1>
          <p class="page-subtitle">Add, edit, and remove food items instantly.</p>

            <button class="btn btn-primary btn-sm" onclick="openFoodModal()"><i class="fa-solid fa-plus"></i> Add Food</button>
          </div>
          <div style="overflow-x:auto;">
            <table class="admin-table">
              <thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Rating</th><th>Actions</th></tr></thead>
              <tbody id="menuTableBody"></tbody>
            </table>
          </div>
        </div>
      `;

      bindSearchInput();
      console.log("ADMIN MENU DATA:", Menu.getAll());
      const tbody = document.getElementById('menuTableBody');
      const items = Menu.getAll().filter(item => {
        if (!searchTerm) return true;
        return [item.name, item.category, item.desc].some(value => String(value).toLowerCase().includes(searchTerm));
      });
      tbody.innerHTML = items.map(item => `
        <tr>
          <td>
  <img
    class="row-thumb"
    src="http://127.0.0.1:5500/Frontend/project/assets/images/food/${ item.name?.trim().toLowerCase() === "puri bhaji" ? "Puri Bhaji.png" : item.name?.trim().toLowerCase() === "cup ice cream" ? "Cup Ice Cream.jpg" : `${item.name?.trim()}.jpg` }"
    alt="${escapeHtml(item.name)}"
    onerror="this.style.display='none'"
  />
</td>
          <td style="font-weight:600;">${escapeHtml(item.name)}</td>
          <td><span class="badge badge-primary">${escapeHtml(item.category)}</span></td>
          <td style="font-weight:700;color:var(--primary);">${formatINR(item.price)}</td>
          <td><i class="fa-solid fa-star" style="color:var(--warning);"></i> ${item.rating}</td>
          <td>
            <button class="action-btn" style="background:rgba(52,152,219,0.15);color:var(--info);" onclick="openFoodModal(${item.id})"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
            <button class="action-btn" style="background:rgba(231,76,60,0.15);color:var(--error);" onclick="deleteFood(${item.id})"><i class="fa-solid fa-trash"></i> Delete</button>
          </td>
        </tr>
      `).join('');

    async function loadBackendStudents() {
  try {
    const response = await fetch("http://127.0.0.1:5000/api/admin/students");

    if (!response.ok) {
      throw new Error("Failed to load students");
    }

    const backendStudents = await response.json();

    console.log("Backend Students:", backendStudents);

    return backendStudents;

  } catch (error) {
    console.error("Students API Error:", error);
    Toast.show("Unable to load students from backend", "error", 2000);
    return [];
  }
}

async function loadBackendQR() {
    try {
        const response = await fetch("http://127.0.0.1:5000/api/admin/qr");

        if (!response.ok) {
            throw new Error("Failed to load QR records");
        }

        const result = await response.json();

        console.log("Backend QR:", result);

        if (!result.success) {
            throw new Error(result.error || "QR API error");
        }

        return result.data;

    } catch (error) {
        console.error("QR API Error:", error);
        Toast.show("Unable to load QR records from backend", "error", 2000);
        return [];
    }
}

    async function openFoodModal(id = null) {
      const item = Menu.getAll().find(i => i.id === Number(id));
      const editing = Boolean(item);
      const overlay = Modal.open(`
        <h3 style="margin-bottom:16px;">${editing ? 'Edit Food Item' : 'Add New Food Item'}</h3>
        <div class="field"><label>Food Name</label><input class="input" id="foodName" value="${escapeHtml(item?.name || '')}" /></div>
        <div class="field"><label>Category</label><select class="select" id="foodCategory">${CATEGORIES.map(c => `<option value="${c.id}" ${String(item?.category) === String(c.id) ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}</select></div>
        <div class="field"><label>Price (₹)</label><input class="input" id="foodPrice" type="number" value="${item?.price || ''}" /></div>

      `);

    overlay.querySelector('#saveFoodBtn').onclick = async () => {
        const name = overlay.querySelector('#foodName').value.trim();
        const category = overlay.querySelector('#foodCategory').value;
        console.log("Selected Category ID:", category);
        const price = Number(overlay.querySelector('#foodPrice').value);
        const img = overlay.querySelector('#foodImg').value.trim();
        const desc = overlay.querySelector('#foodDesc').value.trim();

        if (!name || !category || Number.isNaN(price)) {
          Toast.show('Please fill all required fields', 'error');
          return;
        }

        if (editing) {
           try {
             const response = await fetch(
                `http://127.0.0.1:5000/api/admin/foods/${item.id}`,
               {
                 method: "PUT",
                 headers: {
                   "Content-Type": "application/json"
                 },
                 body: JSON.stringify({
                  Food_name: name,
                  Category_id: category,
                  Price: price,
                  Image: img,
                  Available: item.available || "1"
                })
             }
         );

       const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.message || "Food update failed");
    }

    Menu.update(item.id, {
      name,
      category,
      price,
      img,
      desc
    });

    Toast.show("Food item updated", "success");

  } catch (error) {
    console.error("Food Update Error:", error);
    Toast.show("Failed to update food item", "error");
    return;
  }

  } else {
    try {
        const response = await fetch(
            "http://127.0.0.1:5000/api/foods",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    Food_name: name,
                    Category_id: category,
                    Price: price,
                    Image: img,
                    Available: "1"
                })
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Food add failed");
        }

        Toast.show("Food item added successfully", "success");

    } catch (error) {
        console.error("Food Add Error:", error);
        Toast.show("Failed to add food item", "error");
        return;
    }
}

        overlay.remove();
        setActiveSection('menu');
      };
    }

        overlay.remove();
        await renderStudentsSection();
      };
    }

    window.openFoodModal = openFoodModal;
    window.openStudentModal = openStudentModal;

   window.deleteFood = async function (id) {
  const item = Menu.getAll().find(i => i.id === Number(id));

  if (!item) return;

  if (!confirm(`Delete ${item.name}?`)) return;

  try {
    const response = await fetch(
      `http://127.0.0.1:5000/api/foods/${id}`,
      {
        method: "DELETE"
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.message || "Food delete failed");
    }

    Toast.show("Food item deleted successfully", "success");

    setActiveSection("menu");

  } catch (error) {
    console.error("Food Delete Error:", error);
    Toast.show("Failed to delete food item", "error");
  }
};

   window.deleteStudent = async function (id) {
  const student = (await loadBackendStudents()).find(
    s => s.id === Number(id)
  );

  if (!student) return;

  if (!confirm(`Delete ${student.name}?`)) return;

  try {
    const response = await fetch(
      `http://127.0.0.1:5000/api/admin/students/${id}`,
      {
        method: "DELETE"
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || "Student delete failed");
    }

    Toast.show("Student deleted successfully", "success");

    await renderStudentsSection();

  } catch (error) {
    console.error("Student Delete Error:", error);
    Toast.show(error.message || "Failed to delete student", "error");
  }
};
    window.setActiveSection = function (section) {
      activeSection = section;
      document.querySelectorAll('.nav-item[data-section]').forEach(link => {
        link.classList.toggle('active', link.getAttribute('data-section') === section);
      });

      if (section === 'menu') renderMenuSection();
      else if (section === 'students') renderStudentsSection();
      else if (section === 'orders') renderOrdersSection();
      else if (section === 'reports') renderReportsSection();
      else if (section === 'qr') renderQrSection();
      else renderDashboardSection();
    };

    document.querySelectorAll('.nav-item[data-section]').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        window.setActiveSection(link.getAttribute('data-section'));
      });
    });

    window.setActiveSection('dashboard');

    // Refresh dashboard analytics in real-time when orders or menu data change
    window.addEventListener('orders.updated', () => {
      if (activeSection === 'dashboard') {
        try { renderDashboardSection(); } catch (e) { /* ignore */ }
      }
    });
    window.addEventListener('menu.updated', () => {
      if (activeSection === 'dashboard') {
        try { renderDashboardSection(); } catch (e) { /* ignore */ }
      }
    });
    window.addEventListener('storage', event => {
      if (activeSection === 'dashboard' && (event.key === 'scms_orders' || event.key === 'scms_menu_items')) {
        try { renderDashboardSection(); } catch (e) { /* ignore */ }
      }
    });

    async function loadAdminDashboardStats() {
  try {
    const response = await fetch(
      "http://127.0.0.1:5000/api/admin/dashboard"
    );

    if (!response.ok) {
      throw new Error("Failed to load dashboard data");
    }

    const data = await response.json();

    console.log("Dashboard API data:", data);

    if (!data.success) {
      throw new Error(data.error || "Dashboard API error");
    }

    const statValues = document.querySelectorAll(".stat-value");

    if (statValues.length >= 4) {
      statValues[0].textContent = data.total_foods;
      statValues[1].textContent = data.total_orders;
      statValues[2].textContent =
        "₹" + Number(data.total_revenue).toLocaleString("en-IN");
      statValues[3].textContent = data.pending_orders;
    }

  } catch (error) {
    console.error("Dashboard API Error:", error);
  }
}
