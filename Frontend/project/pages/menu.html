<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Menu - Smart Canteen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>
  <script src="../js/app.js"></script>
  <script src="../js/translations.js"></script>
  <script>
    initDashboard('menu');
    const content = document.getElementById('pageContent');
    content.innerHTML = `
      <div class="page-header">
        <h1 class="page-title">Food Menu <i class="fa-solid fa-utensils"></i></h1>
        <div style="margin-top:8px">
          <a class="btn btn-primary btn-sm" href="food-scan.html">Scan Food (Camera)</a>
        </div>
        <p class="page-subtitle">Browse delicious items</p>
      </div>
      <div class="food-grid" id="foodGrid"></div>
    `;

  function buildFoodCard(item, badgeText = item.Category_id) {
    const card = document.createElement("div");
    card.className = "food-card";

    const imageFiles = {
    "Tea": "Tea.jpg",
    "Coffee": "Coffee.jpg",
    "Poha": "Poha.jpg",
    "Upma": "Upma.jpg",
    "Vada Pav": "Vada Pav.jpg",
    "Samosa": "Samosa.jpg",
    "Water Bottle": "Water Bottle.jpg",
    "Fizz Jeera Soda": "Fizz Jeera Soda.jpg",
    "Sprite": "Sprite.jpg",
    "Thums Up": "Thums Up.jpg",
    "Cornetto Ice Cream": "Cornetto Ice Cream.jpg",
    "Chocobar Ice Cream": "Chocobar Ice Cream.jpg",
    "Pani puri": "Pani Puri.jpg",
    "Bhel": "Bhel.jpg",
    "Samosa chaat": "Samosa Chaat.jpg",
    "Veg Thali": "Veg Thali.jpg",
    "Dahi Puri": "Dahi Puri.jpg",
    "Misal Pav": "Misal Pav.jpg",
    "Pav Bhaji": "Pav Bhaji.jpg",
    "Idli": "Idli.jpg",
    "Dosa": "Dosa.jpg",
    "Lassi": "Lassi.jpg",
    "Puri Bhaji": "Puri Bhaji.png",
    "Maaza": "Maaza.jpg",
    "cup ice cream": "Cup Ice Cream.jpg",
    "Potato chips": "Potato Chips.jpg",
    "Tedhe Medhe": "Tedhe Medhe.jpg",
    "Dark Chocolate": "Dark Chocolate.jpg",
    "Dairy Milk": "Dairy Milk.jpg",
    "5 Star": "5 Star.jpg",
    "Strawberry": "Strawberry.jpg",
    "pulse": "Pulse.jpg",
    "Masala chips": "Masala Chips.jpg",
    "Tomato Chips": "Tomato Chips.jpg"
};

const imageName = imageFiles[item.Food_name];

    card.innerHTML = `
        <div class="food-img-wrap"
             style="display:flex;align-items:center;justify-content:center;position:relative;">

            <img
             class="food-img"
             src="../assets/images/food/${imageName}"
             alt="${item.Food_name}"
             loading="lazy"
             onerror="this.style.display='none';"
        />

            <span class="food-cat-badge">${badgeText}</span>

            <button
                class="food-fav"
                onclick="Fav.toggle(${item.Food_id});this.classList.toggle('active')">
                <i class="fa-solid fa-heart"></i>
            </button>
        </div>

        <div class="food-body">

            <div class="food-name">
                ${item.Food_name}
            </div>

            <div class="food-meta">

                <span class="food-price">
                    ₹${item.Price}
                </span>

                <span class="food-rating">
                    <span class="stars">★★★★★</span>
                </span>

            </div>


        </div>
    `;

    return card;
}


async function renderFood(category = "All") {

    try {

        const response = await fetch(
            "http://127.0.0.1:5000/api/foods"
        );

        if (!response.ok) {
            throw new Error("Failed to load food data");
        }

        const menuItems = await response.json();

        console.log("Food data from database:", menuItems);

        const grid = document.getElementById("foodGrid");

        if (!grid) {
            console.error("foodGrid element not found");
            return;
        }

        grid.innerHTML = "";

        const items = category === "All"
            ? menuItems
            : menuItems.filter(
                item => String(item.Category_id) === String(category)
            );


        if (items.length === 0) {

            grid.innerHTML = `
                <div class="empty-state">

                    <span class="emoji">
                        <i class="fa-solid fa-utensils"></i>
                    </span>

                    <p>No items in this category yet.</p>

                </div>
            `;

            return;
        }


        items.forEach(item => {

            const card = buildFoodCard(item);

            grid.appendChild(card);

        });

    }

    catch (error) {

        console.error(
            "Error loading foods from backend:",
            error
        );

    }
}


renderFood();


  </script>
</body>
</html>
